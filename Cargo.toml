[package]
name = "unseat"
version = "0.1.1"
edition = "2021"
description = "Always-on-top Windows sitting timer and break reminder"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/flyingsatoshi/unseat"
homepage = "https://github.com/flyingsatoshi/unseat"
authors = ["FlyingSatoshi"]
keywords = ["timer", "sitting-timer", "break-timer", "windows", "overlay"]
categories = ["gui"]
publish = false

[lib]
name = "unseat"
path = "src/lib.rs"

[[bin]]
name = "unseat"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:windows"]

[build-dependencies]
embed-resource = "3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", optional = true, features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
